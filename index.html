<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pointage</title>
<meta name="description" content="Pointage des heures d'arrivée et de départ, enregistrées dans Google Sheets.">
<meta name="theme-color" content="#F2708A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pointage">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Écran de connexion au tableau -->
<section id="setup" class="wrap" hidden>
  <div class="hello solo">
    <div>
      <h1>Connexion</h1>
      <div class="date">Relie l'appli à ton tableau</div>
    </div>
  </div>
  <div class="hero">
    <label class="field"><span class="label">Prénom (facultatif)</span>
      <input id="cfgName" autocomplete="given-name" placeholder="Ton prénom"></label>
    <label class="field"><span class="label">Adresse du script (finit par /exec)</span>
      <input id="cfgUrl" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label class="field"><span class="label">Code d'accès</span>
      <input id="cfgKey" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="10 caractères"></label>
    <button class="big" id="cfgSave">Connecter</button>
    <button class="link" id="cfgCancel" hidden>Annuler</button>
    <div class="msg" id="cfgMsg"></div>
  </div>
</section>

<!-- Écran principal -->
<section id="main" class="wrap" hidden>
  <div class="hello">
    <div>
      <h1 id="greet">Bonjour 👋</h1>
      <div class="date" id="dayLabel">…</div>
    </div>
    <div class="actions">
      <button class="round small" id="settings" aria-label="Réglages">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <label class="round" aria-label="Choisir un autre jour">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        <input type="date" id="date">
      </label>
    </div>
  </div>

  <div class="hero">
    <div class="label">Il est</div>
    <div class="clock" id="clock">--:--</div>
    <div class="toggle">
      <button id="mIn" class="on">Arrivée</button>
      <button id="mOut">Départ</button>
    </div>
    <div class="chips">
      <label class="chip"><span class="label">Heure validée</span><input type="time" id="time"></label>
      <label class="chip off" id="pauseChip"><span class="label">Pause</span><input type="time" id="pause"></label>
    </div>
    <button class="link" id="pauseLink">Pause différente d'1 h ?</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="tiles">
    <div class="tile t1">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div>
      <span>Arrivée</span><b id="sIn">–</b>
    </div>
    <div class="tile t2">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></div>
      <span>Départ</span><b id="sOut">–</b>
    </div>
    <div class="tile t3">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <span>Travaillé</span><b id="sWork">–</b>
    </div>
    <div class="tile t4">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l5-5 4 4 7-7"/><path d="M15 8h5v5"/></svg></div>
      <span>Écart du jour</span><b id="sGap">–</b>
    </div>
  </div>

  <div class="week">
    <div class="week-head"><h2>Ma semaine</h2><span class="pill">Lun → Ven</span></div>
    <div class="total" id="weekTotal">–</div>
    <div class="bars" id="bars"></div>
  </div>

  <div class="dock">
    <div class="dock-in">
      <div class="who"><span id="dockHint">Prête ?</span><b id="dockState">–</b></div>
      <button class="go" id="go">
        <span id="goLabel">Valider</span>
        <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>
    </div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
